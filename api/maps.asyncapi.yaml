      "MapsQ7ListEnvelope": {
        "name": "MapsQ7ListEnvelope",
        "summary": "Requests the Q7 saved-map list",
        "payload": {
          "$ref": "#/components/schemas/MapsQ7ListEnvelope"
        },
        "examples": [
          {
            "name": "Synthetic-q7-list",
            "summary": "Synthetic protocol example.",
            "payload": {
              "dps": {
                "10000": {
                  "method": "service.get_map_list",
                  "msgId": "100000000001",
                  "params": {}
                }
              }
            }
          }
        ]
      },
      "MapsQ7ListReply": {
        "name": "MapsQ7ListReply",
        "summary": "Returns a decoded Q7 RPC response from JSON-string datapoint 10000",
        "payload": {
          "$ref": "#/components/schemas/MapsQ7ListReply"
        },
        "correlationId": {
          "location": "$message.payload#/msgId"
        },
        "x-datapoint": "10000",
        "description": "The MQTT datapoint contains a JSON string; this schema describes its decoded object.",
        "examples": [
          {
            "name": "Synthetic-q7-list-reply",
            "summary": "Synthetic protocol example.",
            "payload": {
              "msgId": "100000000001",
              "code": 0,
              "data": {
                "map_list": [
                  {
                    "id": 7,
                    "cur": true
                  }
                ]
              }
            }
          }
        ]
      },
      "MapsQ7UploadEnvelope": {
