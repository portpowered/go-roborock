  "info": {
    "title": "Roborock map commands and binary pushes",
    "version": "1.0.0",
    "description": "Map retrieval requests and family-specific results. Q10 current-map reads use DP102 empty object only; DP61 op:get can initiate movement and is excluded. Known operations bind decoded encrypted-frame payloads to method and datapoint variants; generic carriers preserve future firmware fields."
  },
