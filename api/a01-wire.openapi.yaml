{
  "openapi": "3.0.3",
  "info": {
    "title": "Roborock A01 Wire Models",
    "version": "0.1.0",
    "description": "Documentation inventory for A01 MQTT datapoint exchanges. The paths below identify protocol operations for documentation; they are not HTTP endpoints. Contracts are reference-derived and not live-device verified."
  },
  "paths": {
    "/query_values": {
      "post": {
        "tags": [
          "a01"
        ],
        "operationId": "queryA01Values",
        "summary": "Query selected appliance properties",
        "description": "Documentation-only MQTT operation. GetDyadState or GetZeoState sends an A01 datapoint query and waits for every selected, appliance-supported property. Unselected public fields remain absent. Missing properties result in timeout when the caller deadline expires.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/A01QueryRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "One or more MQTT datapoint updates carrying the selected values.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/A01QueryResponse"
                }
              }
            }
          }
        }
      }
    },
    "/set_values": {
      "post": {
        "tags": [
          "a01"
        ],
        "operationId": "setA01Values",
        "summary": "Publish appliance settings or start a washer cycle",
        "description": "Documentation-only MQTT operation. SetDyadSettings and SetZeoSettings publish sparse independent settings. StartZeo bundles the start signal with mode, program, and optional cycle parameters. Publication does not confirm device acceptance or physical completion; commands are never retried automatically.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/A01SetRequest"
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "MQTT publication completed. There is no correlated device acknowledgement for this operation."
          }
        }
      }
    }
  },
