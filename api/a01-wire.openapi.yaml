      "A01QueryDatapoints": {
        "type": "object",
        "description": "A01 ID_QUERY payload. The numeric-key value is a JSON string containing the ordered property ID array, matching pinned Python behavior.",
        "required": [
          "10000"
        ],
        "properties": {
          "10000": {
            "type": "string",
            "x-go-name": "PropertyIDs",
            "description": "JSON-encoded property ID array, for example \"[201,209]\". The value is a string, not an array.",
            "example": "[201,209]"
          }
        },
        "additionalProperties": false
      },
      "A01QueryRequest": {
        "type": "object",
        "description": "Encrypted MQTT request payload before frame padding.",
        "required": [
          "dps",
          "t"
        ],
        "properties": {
          "dps": {
            "$ref": "#/components/schemas/A01QueryDatapoints"
          },
          "t": {
            "type": "integer",
            "format": "int64",
            "description": "Unix timestamp, in seconds."
          }
        }
      },
      "A01QueryResponse": {
        "type": "object",
        "description": "Appliance MQTT datapoint update. Replies may be split across multiple frames; the session merges selected datapoints until every requested ID arrives.",
        "required": [
          "dps"
        ],
        "properties": {
          "dps": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/DyadStateWire"
              },
              {
                "$ref": "#/components/schemas/ZeoStateWire"
              }
            ],
            "description": "Known typed appliance datapoints. Additional future properties are tolerated; the public query projects only selected supported properties."
          },
          "t": {
            "type": "integer",
            "format": "int64",
            "description": "Optional appliance timestamp, in Unix seconds."
          }
        }
      },
      "A01SetRequest": {
        "type": "object",
        "description": "Sparse MQTT setting publication or bundled washer start payload before encryption.",
        "required": [
          "dps",
          "t"
        ],
        "properties": {
          "dps": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/SetDyadSettingsWire"
              },
              {
                "$ref": "#/components/schemas/SetZeoSettingsWire"
              },
              {
                "$ref": "#/components/schemas/StartZeoWire"
              }
            ],
            "description": "Only supplied settings are published; a Zeo cycle start includes the start signal, mode, and program together."
          },
          "t": {
            "type": "integer",
            "format": "int64",
            "description": "Unix timestamp, in seconds."
          }
        }
      }
    }
  },
  "tags": [
    {
      "name": "a01",
      "description": "Typed wet-cleaner and washer operations over an account-bound MQTT device session."
    }
  ]
}
