openapi: 3.0.3
info:
  title: Roborock MQTT RPC envelopes
  version: 1.0.0
paths: {}
x-wire-constants:
  MQTTVersionV1: '1.0'
  MQTTVersionA01: A01
  MQTTWireSalt: 'TXdfu$jyZ#TZHsg4'
  MQTTA01Hash: 726f626f726f636b2d67a6d6da
  MQTTFrameSequenceOffset: 3
  MQTTFrameRandomOffset: 7
  MQTTFrameTimestampOffset: 11
  MQTTFrameProtocolOffset: 15
  MQTTFramePayloadLengthOffset: 17
  MQTTFramePayloadOffset: 19
  MQTTFrameHeaderSize: 19
  MQTTFrameChecksumSize: 4
  MQTTProtocolRequest: 101
  MQTTProtocolResponse: 102
  MQTTRPCRequestDatapoint: '101'
  MQTTRPCResponseDatapoint: '102'
  MQTTQueryDatapoint: '10000'
  MQTTPublishTopicPrefix: rr/m/i/
  MQTTSubscribeTopicPrefix: rr/m/o/
  MQTTProtocolName: MQTT
  MQTTProtocolLevel: 4
  MQTTConnectFlags: 194
  MQTTConnect: 16
  MQTTConnAck: 32
  MQTTPublish: 48
  MQTTPubAck: 64
  MQTTSubscribe: 130
  MQTTSubAck: 144
  MQTTPingReq: 192
  MQTTPingResp: 208
  MQTTQoSAtMostOnce: 0
  MQTTQoSAtLeastOnce: 1
  MQTTKeepaliveSeconds: 45
  MQTTUint16Size: 2
  MQTTVarintBase: 128
  MQTTVarintMask: 127
  MQTTVarintContinuation: 128
  MQTTMaxRemainingLengthOctets: 4
  MQTTQoSMask: 3
  MQTTKindShift: 4
  MQTTKindPublish: 3
  MQTTConnAckLength: 2
  MQTTSubAckLength: 3
  MQTTSubscribeIdentifier: 1
  MQTTMaxStringLength: 65535
  MQTTUsernameLength: 8
  MQTTTopicSeparators: 2
  MQTTBadUsernamePassword: 4
  MQTTNotAuthorized: 5
components:
  schemas:
    MQTTDeviceFrame:
      type: object
      description: Decoded Roborock binary MQTT device frame. Fields are serialized in the documented binary header order, followed by encrypted payload and a CRC32 checksum; this is not a JSON wire envelope.
      required: [version, sequence, random, timestamp, protocol, payload]
      properties:
        version:
          type: string
          description: Three ASCII bytes identifying the binary protocol version.
          minLength: 3
          maxLength: 3
        sequence:
          type: integer
          minimum: 0
          maximum: 4294967295
          x-go-type: uint32
        random:
          type: integer
          minimum: 0
          maximum: 4294967295
          x-go-type: uint32
        timestamp:
          type: integer
          description: Unix timestamp in seconds stored as an unsigned 32-bit integer.
          minimum: 0
          maximum: 4294967295
          x-go-type: uint32
        protocol:
          type: integer
          minimum: 0
          maximum: 65535
          x-go-type: uint16
        payload:
          type: string
          format: byte
          description: Decrypted payload bytes, before encryption and PKCS7 padding.
          x-go-type: '[]byte'
    MQTTEnvelope:
      type: object
      required: [dps, t]
      properties:
        dps:
          type: object
          additionalProperties:
            x-go-type: json.RawMessage
        t:
          type: integer
          format: int64
          description: Unix timestamp in seconds.
    MQTTRPCRequest:
      type: object
      required: [id, method, params, security]
      properties:
        id:
          type: integer
          format: int64
        method:
          type: string
          pattern: '^[a-zA-Z0-9_]+$'
        params:
          x-go-type: json.RawMessage
        security:
          $ref: '#/components/schemas/MQTTRPCSecurity'
    MQTTRPCSecurity:
      type: object
      required: [endpoint, nonce]
      properties:
        endpoint:
          type: string
          description: Base64 encoding of bytes 8 through 13 of the account-key MD5.
        nonce:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Fresh session AES key for secured device blob responses, encoded as lowercase hex.
    MQTTRPCResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
        result:
          x-go-type: json.RawMessage
        error:
          $ref: '#/components/schemas/MQTTRPCError'
    MQTTRPCError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
