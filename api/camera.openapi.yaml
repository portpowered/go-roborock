{
  "openapi": "3.0.3",
  "info": {
    "title": "Roborock V1 camera signaling RPC inventory",
    "version": "1.0.0",
    "description": "Device MQTT JSON RPC inventory represented using OpenAPI for model generation and documentation. The path names are RPC method names and POST indicates a request/result exchange; these are not HTTP endpoints."
