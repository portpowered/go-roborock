  "paths": {
    "/check_homesec_password": {
      "post": {
        "operationId": "CameraCheckPasswordRPC",
        "summary": "CameraCheckPassword for camera signaling",
        "description": "Documentation-only MQTT RPC: this path describes an encrypted device exchange, not an HTTP endpoint. Do not use the HTTP Send button or curl example shown by the reference renderer. Invoke DeviceSession.OpenCamera through the Go SDK. See the camera guide at https://portpowered.github.io/go-roborock/docs/guides/camera. Reference V1 camera signaling contract; the caller supplies SDP and ICE from its WebRTC stack.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CameraPasswordParameters"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Camera signaling result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CameraAcknowledgement"
                }
              }
            }
          }
        },
        "tags": [
          "camera"
        ]
      }
    },
