  "paths": {
    "/user/homes/{homeID}": {
      "get": {
        "operationId": "GetHomeDatav1",
        "summary": "List home devices and products",
        "description": "Retrieve typed home inventory with Hawk authentication.",
        "parameters": [
          {
            "name": "homeID",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          },
          {
            "name": "Authorization",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Home inventory envelope",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HomeDataResponse"
                }
              }
            }
          }
        },
        "tags": [
          "devices"
        ]
      }
    },
