    "/user/homes/{homeID}/rooms": {
      "get": {
        "operationId": "GetHomeRooms",
        "summary": "Refresh rooms belonging to a home",
        "description": "Read cloud room identifiers and available names using account Hawk authentication. Room names can be absent; callers must not invent names.",
        "tags": [
          "devices"
        ],
        "parameters": [
          {
            "name": "homeID",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            }
          },
          {
            "name": "Authorization",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Room list envelope",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HomeRoomsResponse"
                }
              }
            }
          }
        }
      }
    },
    "/user/deviceshare/query/{deviceID}/rooms": {
      "get": {
        "operationId": "GetSharedDeviceRooms",
        "summary": "Refresh room names for a shared device",
        "description": "Read cloud room identifiers and available names using account Hawk authentication. Room names can be absent; callers must not invent names.",
        "tags": [
          "devices"
        ],
        "parameters": [
          {
            "name": "deviceID",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Authorization",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Room list envelope",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SharedDeviceRoomsResponse"
                }
              }
            }
          }
        }
      }
    }
  },
