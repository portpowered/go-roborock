    "title": "Roborock V1 vacuum RPC inventory",
    "version": "1.0.0",
    "description": "Device MQTT JSON RPC inventory represented using OpenAPI for model generation and documentation. The path names are RPC method names and POST indicates a request/result exchange; these are not HTTP endpoints."
  },
  "paths": {
    "/get_status": {
      "post": {
        "operationId": "GetStatusRPC",
        "summary": "GetStatus on a vacuum",
        "description": "Documentation-only MQTT RPC: this path describes an encrypted device exchange, not an HTTP endpoint. Do not use the HTTP Send button or curl example shown by the reference renderer. Invoke DeviceSession.GetStatus through the Go SDK. See the vacuum guide at https://portpowered.github.io/go-roborock/docs/guides/vacuum. JSON RPC inventory entry for get_status. Commands acknowledge acceptance without implying physical completion.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NoParameters"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Device RPC result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Status"
                }
              }
            }
          }
        },
        "tags": [
          "vacuum"
        ]
      }
    },
