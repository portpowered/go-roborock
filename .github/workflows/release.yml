name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing SDK tag to verify
        required: true
        type: string
permissions:
  contents: write
jobs:
  verify-tag:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify exact tag commit
        run: make check
      - name: Verify public API version policy
        run: go run ./tools/compatibility -base previous-release -module github.com/portpowered/go-roborock -packages pkg/roborock -policy release -version "$VERSION"
      - name: Verify published public SDK as a consumer
        run: |
          consumer=$(mktemp -d)
          cd "$consumer"
          go mod init consumer.example/roborock
          for attempt in 1 2 3 4 5 6; do
            if go get github.com/portpowered/go-roborock@"$VERSION"; then break; fi
            if test "$attempt" = 6; then exit 1; fi
            sleep 10
          done
          printf 'package consumer\nimport _ "github.com/portpowered/go-roborock/pkg/roborock"\n' > consumer.go
          go mod tidy
          go build ./...
      - name: Prepare draft release for final independent review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --draft --verify-tag --generate-notes
          fi
